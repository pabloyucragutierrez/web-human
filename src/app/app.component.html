<div class="card__cookies" *ngIf="showCookieCard">
  <article>
    <div class="title__cookies">
      <img src="assets/logo_cookies.png" alt="" />
      <h2>Este sitio web utiliza cookies</h2>
    </div>
    <p>
      Utilizamos cookies propias y de terceros para mejorar tu experiencia de
      navegación, analizar el uso del sitio y personalizar el contenido. Puedes
      aceptar todas las cookies o configurar tus preferencias.
    </p>
    <div class="opciones__cookies">
      <button>Política de cookies</button>
      <button>Configurar Cookies</button>
      <button class="cookie_active" (click)="acceptCookies()">Aceptar todas la cookies</button>
    </div>   
  </article>
  <img src="assets/ellipse_cookie.png"  class="ellipse_cookie" alt="">
</div>
